<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrix Bot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    html, body {
      overflow: hidden;
      background: #000;
      font-family: monospace;
    }

    #matrix-rain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #content {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      pointer-events: none;
    }

    #content button,
    #content a,
    #content input,
    #content textarea,
    #content select {
      pointer-events: auto;
    }

    #hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .logo {
      font-size: 4rem;
      color: #0F0;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 10px #0F0, 0 0 20px #0F0, 0 0 40px #0F0, 0 0 80px #003300;
      animation: glow-pulse 2s ease-in-out infinite;
    }

    @keyframes glow-pulse {
      0%, 100% {
        text-shadow: 0 0 10px #0F0, 0 0 20px #0F0, 0 0 40px #0F0, 0 0 80px #003300;
      }
      50% {
        text-shadow: 0 0 20px #0F0, 0 0 40px #0F0, 0 0 60px #0F0, 0 0 100px #003300;
      }
    }

    .tagline {
      color: #00CC00;
      font-size: 1.3rem;
      margin-top: 1rem;
      letter-spacing: 2px;
      opacity: 0.9;
    }

    .cta-button {
      background: transparent;
      border: 2px solid #0F0;
      color: #0F0;
      padding: 15px 40px;
      font-size: 1.1rem;
      font-family: monospace;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 3px;
      transition: all 0.3s;
      margin-top: 2rem;
    }

    .cta-button:hover {
      background: rgba(0, 255, 0, 0.1);
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
    }
  </style>
</head>
<body>
  <canvas id="matrix-rain"></canvas>

  <div id="content">
    <section id="hero">
      <h1 class="logo">Matrix Bot</h1>
      <p class="tagline">AI-Powered WhatsApp Agents for Your Business</p>
      <button id="chat-toggle" class="cta-button">Talk to our Agent</button>
    </section>
  </div>

  <script>
    const canvas = document.getElementById('matrix-rain');
    const ctx = canvas.getContext('2d');

    const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
    const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const digits = '0123456789';
    const characters = katakana + latin + digits;

    const fontSize = 16;
    let columns;
    let rainDrops;

    function initCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const newColumns = Math.floor(canvas.width / fontSize);

      if (rainDrops && newColumns <= columns) {
        // Keep existing drops, trim if needed
        rainDrops.length = newColumns;
      } else if (rainDrops && newColumns > columns) {
        // Extend with new random positions
        for (let i = columns; i < newColumns; i++) {
          rainDrops.push(Math.floor(Math.random() * (canvas.height / fontSize)));
        }
      } else {
        // First init: randomize starting positions for immediate visual
        rainDrops = [];
        for (let i = 0; i < newColumns; i++) {
          rainDrops.push(Math.floor(Math.random() * (canvas.height / fontSize)));
        }
      }

      columns = newColumns;
    }

    function draw() {
      // Semi-transparent black to create trail fade effect
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0F0';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < columns; i++) {
        const char = characters.charAt(Math.floor(Math.random() * characters.length));
        const x = i * fontSize;
        const y = rainDrops[i] * fontSize;

        ctx.fillText(char, x, y);

        // Reset drop when past canvas height
        if (y > canvas.height && Math.random() > 0.975) {
          rainDrops[i] = 0;
        }

        rainDrops[i]++;
      }
    }

    initCanvas();
    setInterval(draw, 30);

    window.addEventListener('resize', initCanvas);
  </script>
</body>
</html>
